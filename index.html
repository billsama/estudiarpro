<title>Simulador Custodia de Expedientes</title>
<style>:root{--bg:#10112e;--card:#1c1d45;--card2:#262861;--tx:#eef0ff;--mut:#9a9dc8;--bd:#34377a;--ac:#ff3d71;--ac2:#7b5cff;--cy:#00d4ff;--ok:#4be3a1;--ko:#ff6b7d;--okbg:#12362f;--kobg:#40182b;--warn:#ffd27a;--warnbg:#3a3115;--acfg:#fff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(120% 50% at 50% -8%,#0a6bd6 0%,transparent 62%),var(--bg);min-height:100vh;padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0)) 0 max(14px,env(safe-area-inset-left,0))}
.wrap{max-width:560px;margin:0 auto;padding:14px 0 calc(86px + env(safe-area-inset-bottom,0))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),#c2185b);display:grid;place-items:center;font-weight:800}
.top h1{font-size:1.02rem;margin:0;line-height:1.2}.top small{color:var(--mut);display:block;font-size:.74rem}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 8px 24px #0006,inset 0 1px 0 #ffffff10}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--bd);border-radius:14px;padding:10px}
.stat b{display:block;font-size:1.35rem}.stat span{color:var(--mut);font-size:.72rem}
.pill{float:right;background:linear-gradient(90deg,var(--cy),#0a8cff);color:#001;font-size:.68rem;font-weight:700;border-radius:10px;padding:1px 8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gz{text-align:center;position:relative}.gz svg{width:100%;max-width:150px}.gv{font-size:1.4rem;font-weight:800;margin-top:-30px}.gl{color:var(--mut);font-size:.76rem}
.sub{color:var(--mut);font-size:.86rem;margin-bottom:10px}
h2{font-size:.95rem;margin:0 0 8px}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);padding:11px 14px}
button.p{background:linear-gradient(90deg,var(--ac),#c2185b);border-color:transparent;color:var(--acfg);font-weight:600}
button.c{background:linear-gradient(90deg,var(--ac2),var(--cy));border-color:transparent;color:#fff;font-weight:600}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{min-width:0}
.row.f>*{flex:1 1 140px}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:13px}
.opt.sel{border-color:var(--cy);box-shadow:0 0 0 2px var(--cy) inset}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ko{background:var(--kobg);border-color:var(--ko)}
.bar{height:7px;background:#ffffff18;border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.pb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:.8rem}.pb em{flex:0 0 96px;font-style:normal;color:var(--mut)}.pb .bar{flex:1;margin:0}.pb b{width:38px;text-align:right}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.82rem;gap:8px;flex-wrap:wrap}
.exp{margin-top:10px;padding:10px;border-radius:10px;background:#0003;font-size:.9rem;overflow-wrap:anywhere}
.big{font-size:2rem;font-weight:800}
.tag{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:10px;border:1px solid var(--bd);color:var(--mut)}
textarea,input[type=text],input[type=url],input[type=password]{width:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#0004;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px}
textarea{min-height:110px}
select{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card2);color:var(--tx);max-width:100%;width:100%}
label{display:block;font-size:.84rem;color:var(--mut)}label.chk{display:flex;gap:6px;align-items:center;margin:4px 0}
.rev{border-left:4px solid var(--bd);padding-left:10px;margin:14px 0}.rev.ok{border-color:var(--ok)}.rev.ko{border-color:var(--ko)}
.src{color:var(--mut);font-size:.8rem;margin-top:4px}a{color:var(--cy)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:.84rem;margin-top:8px}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;background:#0c0d26ee;backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));z-index:5}
nav button{flex:1;max-width:130px;background:none;border:0;color:var(--mut);font-size:.7rem;padding:6px 2px;border-radius:10px}
nav button i{display:block;font-style:normal;font-size:1.25rem}nav button.on{color:var(--cy);background:#ffffff10}
</style></head><body>

<script>
var BLOQUES={A:"Funciones del puesto",B:"Ética de la función pública",C:"Poder Judicial y Constitución",D:"Gestión pública y normas administrativas",E:"Ofimática y seguridad de la información"};
var BASE=[
{b:"A",q:"Una función del Asistente de Custodia respecto de las audiencias es:",o:["Dirigir la audiencia.","Recibir y almacenar ordenadamente los CDs y copias de seguridad de audio y video.","Redactar sentencias.","Notificar resoluciones a las partes."],c:1,e:"Según las funciones del puesto, recibe y almacena en forma ordenada los CDs y copias de seguridad del audio, video y cualquier registro de audiencias."},
{b:"A",q:"Cuando un juez solicita un CD de audiencia, el asistente debe:",o:["Entregarlo sin registro.","Pedirle que lo recoja otro día sin dejar constancia.","Registrar, en medio manual o informático, la fecha de préstamo y de devolución.","Entregar el original y destruir la copia."],c:2,e:"Función del puesto: prestar CDs y expedientes a jueces y auxiliares registrando fecha de préstamo y devolución."},
{b:"A",q:"Pueden solicitar la lectura de expedientes, conforme corresponda:",o:["Fiscales, abogados, procuradores, imputados y agraviados.","Cualquier persona sin identificación.","Solo los jueces.","Solo el personal administrativo."],c:0,e:"El puesto atiende requerimientos de lectura de Fiscales, Abogados, Procuradores, imputados o agraviados, etc."},
{b:"A",q:"Respecto de los CDs de audiencias y los expedientes, el asistente debe:",o:["Permitir el ingreso libre al área.","Dejarlos sobre el escritorio.","Prestarlos sin registro.","Mantenerlos bajo resguardo y verificar permanentemente su seguridad."],c:3,e:"Función: verificar la permanente seguridad de los CDs de audiencias y expedientes judiciales."},
{b:"A",q:"Si un CD de audiencia presenta deterioro físico, lo correcto es:",o:["Desecharlo.","Preservar la información (por ejemplo, con la copia de seguridad) y comunicar la incidencia.","Entregarlo así a la parte.","Esperar a que deje de reproducirse."],c:1,e:"Se preserva la información con las copias de seguridad y se informa la incidencia para su control."},
{b:"A",q:"Antes de una audiencia, el equipo de grabación no funciona. El asistente, como soporte técnico, debe:",o:["Verificar lo básico (energía, cables, dispositivos de entrada) y, si persiste, escalar al área de soporte informático.","Cancelar la audiencia por su cuenta.","Grabar con su celular personal.","Ignorar el problema."],c:0,e:"La misión del puesto incluye dar soporte técnico a usuarios en equipos de audio y video; se diagnostica lo básico y se escala."},
{b:"A",q:"El registro de préstamos sirve principalmente para:",o:["Modificar el contenido del expediente.","Evitar la atención al público.","Eliminar documentos antiguos.","Conocer la ubicación y el responsable del documento (trazabilidad)."],c:3,e:"Permite controlar quién tiene el documento y su circulación."},
{b:"A",q:"Una persona pide leer un expediente sin acreditar su identidad ni su condición de parte o abogado. El asistente debe:",o:["Entregarlo para no demorar.","Negarse y no orientarla.","Solicitar identificación y verificar su legitimación antes de permitir la lectura.","Derivarla a cualquier otro servidor."],c:2,e:"Se controla el acceso conforme al procedimiento: identificar y verificar condición antes de la lectura."},
{b:"B",q:"Según la Ley 27815 (Código de Ética de la Función Pública), es un deber del servidor público:",o:["Obtener ventajas indebidas.","Discreción.","Presionar o amenazar.","Hacer proselitismo político."],c:1,e:"Deberes (art. 7): neutralidad, transparencia, discreción, ejercicio adecuado del cargo, uso adecuado de los bienes del Estado y responsabilidad. Las otras son prohibiciones (art. 8).",n:"Ojo: algunos solucionarios antiguos marcan la discreción como 'no deber'; el texto de la ley la incluye."},
{b:"B",q:"Es una prohibición ética:",o:["Neutralidad.","Transparencia.","Responsabilidad.","Obtener ventajas indebidas."],c:3,e:"Prohibiciones (art. 8): mantener intereses de conflicto, obtener ventajas indebidas, hacer proselitismo político, hacer mal uso de información privilegiada, presionar, amenazar y/o acosar."},
{b:"B",q:"El principio de probidad consiste en:",o:["Actuar con rectitud, honradez y honestidad, procurando el interés general y desechando todo provecho personal.","Obedecer sin cuestionar.","Guardar reserva de la información.","Capacitarse permanentemente."],c:0,e:"Probidad: rectitud, honradez y honestidad, interés general, sin provecho o ventaja personal. Capacitarse es idoneidad; reservar es discreción."},
{b:"B",q:"Un servidor usa el equipo institucional para fines personales. Vulnera el deber de:",o:["Neutralidad.","Transparencia.","Uso adecuado de los bienes del Estado.","Discreción."],c:2,e:"Debe proteger y conservar los bienes del Estado y utilizarlos para los fines institucionales."},
{b:"B",q:"Para el Código de Ética, servidor público es:",o:["Solo quien tiene nombramiento.","Solo el funcionario de confianza.","Solo quien está en el D. Leg. 276.","Todo aquel que mantiene vínculo laboral o contractual de cualquier naturaleza con una entidad de la Administración Pública y ejerce funciones en ella."],c:3,e:"La definición es amplia: abarca cualquier régimen o vínculo (art. 4)."},
{b:"B",q:"El principio de veracidad implica:",o:["Priorizar el interés personal.","Expresarse con autenticidad ante la institución y la ciudadanía, y contribuir al esclarecimiento de los hechos.","Callar los errores.","Obtener ventajas."],c:1,e:"Veracidad: autenticidad en las relaciones funcionales y contribución al esclarecimiento de los hechos."},
{b:"C",q:"Según el art. 138 de la Constitución, la potestad de administrar justicia emana del pueblo y se ejerce por:",o:["El Poder Judicial.","El Congreso.","El Poder Ejecutivo.","El Ministerio Público."],c:0,e:"Constitución, art. 138: se ejerce por el Poder Judicial a través de sus órganos jerárquicos."},
{b:"C",q:"El máximo órgano de deliberación del Poder Judicial es:",o:["El Consejo Ejecutivo.","La Presidencia de la Corte Suprema.","La Sala Plena de la Corte Suprema.","La Junta Nacional de Justicia."],c:2,e:"TUO de la LOPJ: la Sala Plena de la Corte Suprema es el máximo órgano de deliberación del Poder Judicial.",n:"Verifica el artículo exacto en tu copia del TUO de la LOPJ."},
{b:"C",q:"En un proceso civil, la resolución que no requiere la firma del juez (la suscribe el auxiliar jurisdiccional) es:",o:["La sentencia.","El decreto.","El auto.","Ninguna."],c:1,e:"CPC: los decretos son expedidos y suscritos por el auxiliar jurisdiccional; autos y sentencias los suscribe el juez.",n:"Verifica en el CPC (art. 122)."},
{b:"C",q:"La Nueva Ley Procesal del Trabajo es la Ley:",o:["27497.","26636.","30057.","29497."],c:3,e:"La NLPT es la Ley 29497 (oralidad). La Ley 26636 fue la anterior Ley Procesal del Trabajo; la 30057 es la Ley del Servicio Civil.",n:"En el aviso de convocatoria figura 'Ley N°27497', probablemente un error de tipeo. Confírmalo en los textos oficiales."},
{b:"C",q:"El principio que exige que las resoluciones judiciales expresen sus fundamentos es:",o:["Publicidad.","Cosa juzgada.","Motivación escrita de las resoluciones.","Pluralidad de instancia."],c:2,e:"Constitución, art. 139 inc. 5: motivación escrita de las resoluciones judiciales en todas las instancias."},
{b:"D",q:"Plazo para atender una solicitud de acceso a la información pública (Ley 27806):",o:["Diez días hábiles.","Quince días calendario.","Cinco días hábiles.","Treinta días."],c:0,e:"Diez días hábiles, prorrogables por cinco días hábiles más en casos excepcionales y justificados."},
{b:"D",q:"El principio por el cual las autoridades administrativas actúan con respeto a la Constitución, la ley y el derecho es:",o:["Informalismo.","Legalidad.","Celeridad.","Predictibilidad."],c:1,e:"TUO de la Ley 27444 (D.S. 004-2019-JUS), art. IV: principio de legalidad.",n:"Una búsqueda mostró un TUO más reciente (D.S. 006-2026-JUS). Confirma cuál rige antes del examen."},
{b:"D",q:"El ente rector del Sistema Administrativo de Gestión de Recursos Humanos es:",o:["El MEF.","La PCM.","SERVIR.","La Contraloría."],c:2,e:"SERVIR, Autoridad Nacional del Servicio Civil (Ley 30057)."},
{b:"D",q:"La ley que protege los datos personales es:",o:["Ley 27444.","Ley 27806.","Ley 30057.","Ley 29733."],c:3,e:"Ley 29733, Ley de Protección de Datos Personales. Importante en la custodia de expedientes."},
{b:"E",q:"En Excel, para contar celdas que cumplen un criterio se usa:",o:["CONTAR.SI","SUMAR","BUSCARV","CONCATENAR"],c:0,e:"CONTAR.SI cuenta las celdas de un rango que cumplen una condición."},
{b:"E",q:"Para resumir grandes volúmenes de datos y reagruparlos se usa:",o:["Autorrelleno.","Tabla dinámica.","Combinar celdas.","Vista previa."],c:1,e:"La tabla dinámica resume, agrupa y cruza datos."},
{b:"E",q:"Los tres pilares de la seguridad de la información son:",o:["Rapidez, costo y estética.","Acceso, registro y borrado.","Copia, pegado y corte.","Confidencialidad, integridad y disponibilidad."],c:3,e:"Tríada CID, base de la NTP-ISO/IEC 27001."},
{b:"E",q:"La regla de respaldo 3-2-1 significa:",o:["3 usuarios, 2 claves, 1 equipo.","3 horas, 2 días, 1 semana.","3 copias de los datos, en 2 tipos de medio, con 1 copia fuera de la sede.","3 servidores, 2 discos, 1 CD."],c:2,e:"Buena práctica de copias de seguridad de las grabaciones."},
{b:"E",q:"La capacidad aproximada de un CD-R estándar es:",o:["700 MB.","4,7 GB.","25 GB.","1 TB."],c:0,e:"CD-R estándar: unos 700 MB (80 min de audio). DVD de una capa: 4,7 GB."},
{b:"E",q:"Formato de audio con compresión con pérdida:",o:["WAV.","MP3.","FLAC.","PCM."],c:1,e:"MP3 descarta información. WAV y PCM no comprimen; FLAC comprime sin pérdida."},
{b:"E",q:"Para comprobar que un archivo de grabación no fue alterado se usa:",o:["Cambiarle el nombre.","Moverlo a otra carpeta.","Comprimirlo.","Calcular y comparar su hash (por ejemplo, SHA-256)."],c:3,e:"Un hash distinto indica que el contenido cambió: control de integridad."}
];

function cancelErr(){var e=new Error("cancelled");e.code="cancelled";return e}
function sleep(ms,sig){return new Promise(function(res,rej){
  if(sig&&sig.aborted)return rej(cancelErr());
  var t=setTimeout(res,ms);
  if(sig)sig.addEventListener("abort",function(){clearTimeout(t);rej(cancelErr())})
})}
async function groq(model,msgs,o){
  o=o||{};
  for(var at=0;at<4;at++){
    var body={model:model,messages:msgs,temperature:o.t==null?0.7:o.t,max_tokens:o.max||8000};
    if(!/compound/.test(model))body.response_format={type:"json_object"};
    var r;
    try{
      r=await fetch(GROQ_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+KEY},body:JSON.stringify(body),signal:o.sig});
    }catch(e){
      if(e&&e.name==="AbortError")throw cancelErr();
      var ne=new Error("net");ne.code="network";throw ne;
    }
    if(r.status===429&&at<3){
      var w=Math.min(parseFloat(r.headers.get("retry-after"))||10*(at+1),40);
      setStatus("Límite de uso de Groq alcanzado. Esperando "+Math.ceil(w)+" s y reintento…");
      await sleep(w*1000,o.sig);continue;
    }
    if(!r.ok){
      var he=new Error("http");he.status=r.status;
      try{he.detail=(await r.json()).error.message}catch(_){}
      throw he;
    }
    var d=await r.json();
    return (d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||"";
  }
  var re=new Error("rl");re.status=429;throw re;
}
function parseObj(t){
  t=String(t).replace(/```json|```/g,"").trim();
  try{return JSON.parse(t)}catch(e){}
  var a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(e){}}
  var c=t.indexOf("["),d=t.lastIndexOf("]");
  if(c>=0&&d>c){try{return JSON.parse(t.slice(c,d+1))}catch(e){}}
  return null;
}
function errMsg(e){
  if(!e)return "Error desconocido.";
  if(e.code==="cancelled")return "Generación detenida.";
  if(e.code==="custom")return e.message;
  if(e.code==="network")return "No se pudo conectar con Groq. Revisa tu internet. Si abriste esto dentro de claude.ai, guarda el archivo .html y ábrelo directamente en tu navegador.";
  var d=e.detail?" ("+e.detail+")":"";
  if(e.status===401)return "La clave de Groq no es válida. Revísala.";
  if(e.status===403)return "Groq rechazó la solicitud (403)"+d;
  if(e.status===404)return "Modelo no encontrado en Groq"+d;
  if(e.status===413)return "La solicitud es demasiado grande"+d;
  if(e.status===429)return "Llegaste al límite de uso de Groq. Espera unos minutos e intenta de nuevo.";
  if(e.status===400)return "Groq no aceptó la solicitud"+d;
  return "Falló la conexión con Groq"+(e.status?" ("+e.status+")":"")+d+".";
}

B:["principios del Código de Ética (Ley 27815)","deberes del servidor público","prohibiciones éticas","sanciones y Reglamento (D.S. 033-2005-PCM)","conflicto de intereses","uso de bienes del Estado y de la información"],
C:["organización del Poder Judicial (LOPJ)","principios de la función jurisdiccional (art. 139)","clases de resoluciones judiciales","Nueva Ley Procesal del Trabajo (Ley 29497)","jerarquía de normas y control difuso","vigencia de las normas","derecho penal básico: pena, concurso, imputación"],
D:["acceso a la información pública (Ley 27806)","principios del procedimiento administrativo (TUO 27444)","Política de Modernización de la Gestión Pública","protección de datos personales (Ley 29733)","SERVIR y servicio civil","planeamiento y presupuesto público"],

function toks(t){var o={};norm(t).replace(/[^a-z0-9ñ ]/g," ").split(" ").forEach(function(w){if(w.length>3)o[w]=1});return o}
function sim(a,b){var A=toks(a),B=toks(b),ka=Object.keys(A),n=0;if(!ka.length)return 0;ka.forEach(function(w){if(B[w])n++});var u=ka.length+Object.keys(B).length-n;return u?n/u:0}
function esDup(q,a){
  var all=bank().map(function(x){return {q:x.q,a:x.o[x.c]}}).concat(PEND);
  for(var i=0;i<all.length;i++){
    if(sim(q,all[i].q)>=0.55)return true;

  if(mode==="inf"&&!KEY&&!confirm("No hay clave de Groq guardada: la práctica ilimitada solo usará el banco actual y terminará al acabarse. ¿Continuar?"))return;
  pool=shuffle(pool);

  var pool=SRCS.filter(function(x){return !s.blq||x.b===s.blq}),sr=pool.length?pool[Math.floor(Math.random()*pool.length)]:null;
  var p=(sr?genBatchSrc(sr,s.blq||sr.b||"C","",5,null):genBatch(b,null,"",5,null)).then(function(r){
    r.ok.forEach(function(q){s.qs.push(mk(q))});
    s.err=r.ok.length?"":"La IA no devolvió preguntas válidas esta vez.";

async function readFile(f){

    if(!window.pdfjsLib){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}
    var pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
    for(var p=1;p<=pdf.numPages;p++){var c=await(await pdf.getPage(p)).getTextContent();out.push(c.items.map(function(x){return x.str+(x.hasEOL?"\n":" ")}).join(""))}

  '<div class="row"><button class="p" onclick="itStart()">Empezar entrevista</button></div>'+(KEY?'':'<div class="warn">Necesitas tu clave de Groq (pestaña IA). Mientras tanto, practica con las preguntas frecuentes de abajo.</div>')+'</div>';
  if(INTH.length)h+='<div class="card"><h2>Mis entrevistas</h2><div class="sub" style="margin:0">'+INTH.slice(-4).reverse().map(function(x){return x.f+' · '+x.t+' · promedio '+x.avg+'/10 ('+x.n+' preguntas)'}).join('<br>')+'</div></div>';
  h+='<div class="card"><h2>Preguntas frecuentes y cómo responderlas</h2>'+FAQ.map(function(f){return '<details><summary>'+esc(f[0])+'</summary><div class="exp">'+esc(f[1])+'</div></details>'}).join("")+'</div>';
  app.innerHTML=h;refreshSrc();
}
function itStart(){
  saveCfg();if(!KEY){tab("ia");setStatus("Pega tu clave de Groq para usar la entrevista.");return}
  var n=val("it_n")==="0"?Infinity:(+val("it_n")||10),si=val("it_src");
  IT={t:val("it_t")||"conductual",n:n,i:0,qs:[],q:[],cur:"",fb:null,sc:[],busy:false,err:"",src:si!==""?SRCS[+si]:null};itNext();
}
async function itFetch(){
  var k=Math.min(10,IT.n===Infinity?10:IT.n-IT.qs.length),ctx="";
  if(IT.src){var c=IT.src.chunks[Math.floor(Math.random()*IT.src.chunks.length)];ctx="\nBasa las preguntas en este material que el postulante estudió (sin copiarlo literal):\n<<<\n"+c.slice(0,3500)+"\n>>>"}
  var raw=await groq(CFG.model,[{role:"system",content:"Eres un entrevistador de recursos humanos del Poder Judicial del Perú que evalúa postulantes a Asistente Jurisdiccional de Custodia de Expedientes (Módulo Corporativo Laboral). Respondes solo con JSON válido."},{role:"user",content:"Formula "+k+" preguntas de entrevista DISTINTAS entre sí, de tipo "+TIPOS[IT.t]+". Claras y realistas, de una o dos oraciones."+ctx+(IT.qs.length?"\nNo repitas estas: "+ITQ.concat(IT.qs).slice(-60).join(" | "):"")+'\nFormato: {"preguntas":["...","..."]}'}],{t:0.9});
  var o=parseObj(raw),a=o&&(Array.isArray(o)?o:o.preguntas);
  if(!Array.isArray(a)||!a.length)throw new Error("fmt");
  a.forEach(function(x){x=String(x&&x.pregunta||x).trim();if(x&&IT.qs.indexOf(x)<0&&!ITQ.concat(IT.qs).some(function(y){return sim(x,y)>=0.6})){IT.q.push(x);IT.qs.push(x);ITQ.push(x)}});
  if(!IT.q.length)throw new Error("fmt");
  sv("cust_itq",ITQ.slice(-200));
}
async function itNext(){
  IT.cur="";IT.fb=null;IT.err="";IT.ans="";IT.busy=true;itRender();
  try{if(!IT.q.length)await itFetch();IT.cur=IT.q.shift()}
  catch(e){IT.err=e.message==="fmt"?"La IA no devolvió preguntas válidas. Intenta de nuevo.":errMsg(e)}
  IT.busy=false;itRender();
}
async function itEval(){
  var a=val("it_a");if(a.length<20){IT.err="Escribe una respuesta un poco más completa (mínimo 20 caracteres).";itRender();return}
  IT.busy=true;IT.err="";IT.ans=a;itRender();
  try{
    var raw=await groq(CFG.model,[{role:"system",content:"Eres un evaluador de entrevistas del Poder Judicial del Perú, exigente pero constructivo. Respondes solo con JSON válido y en español."},{role:"user",content:"Pregunta: "+IT.cur+"\nRespuesta del postulante: "+a+'\nEvalúa de 0 a 10 considerando claridad, pertinencia al puesto, ejemplos concretos, ética y reserva. Formato: {"puntaje":7,"fortalezas":["..."],"mejoras":["..."],"respuesta_modelo":"ejemplo breve en primera persona (4 a 6 frases)"}'}],{t:0.3});
    var o=parseObj(raw);if(!o||isNaN(+o.puntaje))throw new Error("fmt");
    IT.fb=o;IT.sc.push(Math.max(0,Math.min(10,+o.puntaje)));
  }catch(e){IT.err=e.message==="fmt"?"La IA no devolvió una evaluación válida. Pulsa Evaluar otra vez.":errMsg(e)}
  IT.busy=false;itRender();
}
function itAfter(){IT.i++;if(IT.i>=IT.n)itRender();else itNext()}
function itEnd(){IT.fin=1;itRender()}
function li(a){return (Array.isArray(a)?a:[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join("")}
function itRender(){
  var s=IT,inf=s.n===Infinity,h='<div class="card"><div class="meta"><span>Pregunta '+(s.i+1)+(inf?' (sin límite)':' de '+s.n)+'</span><span class="tag">'+esc(s.t)+'</span></div><div class="bar"><i style="width:'+(inf?100:Math.round(s.i/s.n*100))+'%"></i></div>';
  if(s.fin||s.i>=s.n){
    var avg=(s.sc.reduce(function(a,b){return a+b},0)/(s.sc.length||1)).toFixed(1);
    h+='<div class="big">'+avg+' / 10</div><div class="sub">Promedio de tu entrevista ('+s.sc.length+' respuestas evaluadas).</div><div class="row"><button class="p" onclick="itStart()">Otra entrevista</button><button onclick="tab(\'entrevista\')">Salir</button></div></div>';
    if(!s.saved&&s.sc.length){s.saved=1;INTH.push({f:new Date().toLocaleDateString("es-PE"),t:s.t,avg:avg,n:s.sc.length});sv("cust_int",INTH)}
    app.innerHTML=h;return;
  }
  if(s.busy&&!s.cur)h+='<p class="sub">El entrevistador está preparando la pregunta…</p>';
  else if(s.cur){
    h+='<p><b>'+esc(s.cur)+'</b></p><div class="row"><button onclick="itSay()">🔊 Escuchar</button></div>';
    if(!s.fb){h+='<textarea id="it_a" placeholder="Escribe tu respuesta o dicta con el micrófono…" style="font-family:inherit;font-size:15px">'+esc(s.ans||"")+'</textarea><div class="row"><button onclick="itMic()">🎤 Dictar</button><button class="p" onclick="itEval()" '+(s.busy?'disabled':'')+'>'+(s.busy?'Evaluando…':'Evaluar respuesta')+'</button></div>'}
    else{var f=s.fb;h+='<div class="exp"><b>Tu respuesta:</b> '+esc(s.ans)+'</div><div class="big">'+esc(String(f.puntaje))+' / 10</div><div class="exp"><b>Fortalezas</b><ul>'+li(f.fortalezas)+'</ul><b>A mejorar</b><ul>'+li(f.mejoras)+'</ul><b>Respuesta modelo</b><br>'+esc(f.respuesta_modelo||"")+'</div><div class="row"><button class="p" onclick="itAfter()">'+(s.i+1>=s.n?'Ver resultado':'Siguiente pregunta')+'</button></div>'}
  }
  if(s.err)h+='<div class="warn">'+esc(s.err)+'</div>'+(!s.cur&&!s.busy?'<div class="row"><button onclick="itNext()">Reintentar</button></div>':'');
  h+='<div class="row"><button onclick="itEnd()">Terminar entrevista</button></div>';
  app.innerHTML=h+'</div>';
}
function itSay(){try{var u=new SpeechSynthesisUtterance(IT.cur);u.lang="es-PE";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function itMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition,a=document.getElementById("it_a");
  if(!SR){IT.err="Tu navegador no permite dictado. Escribe tu respuesta.";itRender();return}
  var r=new SR();r.lang="es-PE";r.interimResults=false;
  r.onresult=function(e){a.value=(a.value+" "+e.results[0][0].transcript).trim()};
  r.onerror=function(){};try{r.start()}catch(e){}
}
document.getElementById("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(b)tab(b.dataset.t)});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("/sw.js").catch(function(){});
home();

</script></body></html>
